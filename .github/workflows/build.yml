name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 需要写权限才能创建 Release 并上传 exe 附件
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build launcher
        shell: pwsh
        run: ./build.ps1

      - name: Rename exe for release (ASCII-safe name)
        shell: pwsh
        run: Copy-Item "DeepSeek Harness 一键启动.exe" "DeepSeek-Harness-Launcher.exe" -Force

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Launcher
          path: DeepSeek-Harness-Launcher.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DeepSeek-Harness-Launcher.exe
